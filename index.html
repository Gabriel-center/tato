<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TATO</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>/* Layout: one full-bleed stage; type floats over it, no panels except the pause menu. */
:root {
  --ink: #0e0c12;        /* stage black, a hair of plum */
  --ink-2: #1a1720;
  --bone: #f1e8da;       /* text: warm paper */
  --dim: #9a91a3;        /* secondary text */
  --ember: #ffb469;      /* the one warm light */
  --ember-deep: #e2773b;
  --line: rgba(241, 232, 218, 0.16);
  --f-display: 'Gloock', 'Bodoni Moda', Didot, 'Times New Roman', serif;
  --f-voice: 'Newsreader', 'Iowan Old Style', Georgia, serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --narr-size: clamp(22px, 3.1vw, 40px);
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ink); color: var(--bone); overflow: hidden; }
body { font-family: var(--f-voice); -webkit-font-smoothing: antialiased; touch-action: none; user-select: none; -webkit-user-select: none; }
body.bigtext { --narr-size: clamp(26px, 4vw, 52px); }
#app { position: fixed; inset: 0; overflow: hidden; background: var(--ink); }
canvas#gl, canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
canvas#gl { opacity: 0; transition: opacity 0.8s; }
canvas#gl.on { opacity: 1; }
#grain {
  position: absolute; inset: -50%; pointer-events: none; opacity: 0.07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  animation: grain 0.9s steps(3) infinite;
}
@keyframes grain { 0% { transform: translate(0, 0); } 33% { transform: translate(-3%, 2%); } 66% { transform: translate(2%, -3%); } 100% { transform: translate(0, 0); } }
#vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%); }

/* ---------- braille progress cell ---------- */
.cell {
  position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); left: max(20px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 12px 12px; grid-auto-rows: 12px; gap: 7px 8px; padding: 6px; opacity: 0.9; z-index: 3;
}
.cell i { width: 12px; height: 12px; border-radius: 50%; background: rgba(241, 232, 218, 0.1); box-shadow: inset 0 1px 1px rgba(0,0,0,0.5); transition: background 0.6s, box-shadow 0.6s, transform 0.6s; }
.cell i.on { background: var(--bone); box-shadow: 0 0 10px rgba(255, 180, 105, 0.7), inset 0 -2px 2px rgba(0,0,0,0.25); transform: scale(1.08); }
.cell i.pop { animation: pop 0.9s ease-out; }
@keyframes pop { 0% { transform: scale(2.2); background: var(--ember); } 100% { transform: scale(1.08); } }
#goal {
  position: absolute; top: calc(26px + env(safe-area-inset-top, 0px)); left: max(78px, calc(env(safe-area-inset-left, 0px) + 60px));
  font: 600 12px/1.2 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone); opacity: 0.75; z-index: 3;
}

/* ---------- narration ---------- */
#narr {
  position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 4; pointer-events: none;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center;
}
#narrLine {
  margin: 0; max-width: 24ch; font: italic 300 var(--narr-size)/1.25 var(--f-voice); letter-spacing: 0.005em; text-wrap: balance;
  text-shadow: 0 2px 24px rgba(0, 0, 0, 0.75), 0 0 2px rgba(0,0,0,0.6);
}
#narrLine .w { display: inline-block; opacity: 0; filter: blur(6px); transform: translateY(6px); transition: opacity 0.7s, filter 0.7s, transform 0.7s; white-space: pre; }
#narrLine .w.in { opacity: 1; filter: blur(0); transform: none; }
#narrLine.out { opacity: 0; filter: blur(4px); transition: opacity 0.5s, filter 0.5s; }
#narrNext { font: 400 12px/1 var(--f-mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--dim); opacity: 0; transition: opacity 0.6s; }
#narrNext.on { opacity: 0.8; }

/* ---------- place card ---------- */
#card { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; pointer-events: none; }
#card h2 { margin: 0; font: 400 clamp(64px, 13vw, 180px)/0.9 var(--f-display); letter-spacing: -0.02em; text-shadow: 0 6px 40px rgba(0,0,0,0.6); }
.cardNum { display: flex; gap: 14px; }
.cardNum span { font: 600 12px/1 var(--f-mono); letter-spacing: 0.3em; color: var(--ember); text-transform: uppercase; }
#card.show h2 { animation: cardIn 3.2s ease forwards; }
#card.show .cardNum { animation: cardIn 3.2s ease forwards; }
@keyframes cardIn { 0% { opacity: 0; letter-spacing: 0.08em; filter: blur(10px); } 25% { opacity: 1; letter-spacing: -0.02em; filter: blur(0); } 78% { opacity: 1; } 100% { opacity: 0; filter: blur(6px); } }

/* ---------- hints ---------- */
#hint {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(26px + env(safe-area-inset-bottom, 0px)); z-index: 4;
  max-width: min(760px, calc(100% - 40px)); text-align: center; font: 400 15px/1.5 var(--f-mono); color: var(--bone); opacity: 0.85;
  text-shadow: 0 1px 10px rgba(0,0,0,0.8); transition: opacity 0.5s;
}
#hint.fade { opacity: 0; }
#hint.top { bottom: auto; top: calc(22px + env(safe-area-inset-top, 0px)); }
#toast {
  position: absolute; left: 50%; top: 22%; transform: translateX(-50%); z-index: 5; font: italic 400 22px/1.3 var(--f-voice);
  color: var(--bone); text-shadow: 0 2px 16px rgba(0,0,0,0.8); transition: opacity 0.4s; text-align: center; max-width: 90%;
}

/* ---------- controller HUD ---------- */
#hud {
  position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: 280px; height: 118px;
  z-index: 3; opacity: 0.92; pointer-events: none;
}

/* ---------- screens ---------- */
.screen { position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.screen.dim { background: rgba(10, 8, 14, 0.72); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.titleInner { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 640px; margin: auto; }
#titleDots { width: min(560px, 86vw); height: auto; aspect-ratio: 900 / 330; }
.wordmark { margin: -6px 0 0; font: 400 clamp(44px, 8vw, 86px)/1 var(--f-display); letter-spacing: 0.32em; padding-left: 0.32em; }
.tagline { margin: 0 0 18px; font: italic 300 clamp(18px, 2.2vw, 24px)/1.3 var(--f-voice); color: var(--dim); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.btn {
  appearance: none; border: 1px solid var(--line); background: rgba(241, 232, 218, 0.04); color: var(--bone);
  font: 600 13px/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 15px 22px; border-radius: 999px;
  display: inline-flex; align-items: center; gap: 10px; cursor: pointer; transition: background 0.2s, border-color 0.2s, transform 0.15s;
}
.btn:hover { background: rgba(241, 232, 218, 0.1); border-color: rgba(241,232,218,0.35); }
.btn:active { transform: scale(0.97); }
.btn:focus-visible, .link:focus-visible, .mi:focus-visible { outline: 2px solid var(--ember); outline-offset: 3px; }
.btn.primary { background: var(--bone); color: var(--ink); border-color: var(--bone); }
.btn.primary:hover { background: #fff; }
.btn.ghost { background: transparent; }
.btn.sel { border-color: var(--ember); box-shadow: 0 0 0 1px var(--ember); }
.btnDot { width: 9px; height: 9px; border-radius: 50%; background: var(--ember-deep); box-shadow: 0 0 8px var(--ember); }
.btn.connected .btnDot { background: #6be38d; box-shadow: 0 0 8px #6be38d; }
.status { min-height: 1.4em; margin: 6px 0 0; font: 400 13px/1.5 var(--f-mono); color: var(--ember); max-width: 52ch; }
.note { margin: 0; font: italic 400 16px/1.45 var(--f-voice); color: var(--dim); max-width: 46ch; }
.titleFoot { margin-top: 18px; display: flex; gap: 10px; align-items: center; font: 400 12px/1 var(--f-mono); color: var(--dim); letter-spacing: 0.06em; flex-wrap: wrap; justify-content: center; }
.link { appearance: none; border: 0; background: none; color: var(--bone); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px; }
.chooserInner, .menuInner { display: flex; flex-direction: column; gap: 18px; align-items: stretch; width: min(420px, 100%); margin: auto; }
.chooserInner h2, .menuInner h2 { margin: 0 0 6px; font: 400 44px/1 var(--f-display); text-align: center; }
.placeList, .menuList { display: flex; flex-direction: column; gap: 8px; }
.mi {
  appearance: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
  padding: 14px 18px; border-radius: 12px; border: 1px solid var(--line); background: rgba(241,232,218,0.03); color: var(--bone);
  font: 400 15px/1.2 var(--f-mono); cursor: pointer; text-align: left;
}
.mi:hover, .mi.focus { background: rgba(241,232,218,0.1); border-color: rgba(255,180,105,0.6); }
.mi .v { color: var(--ember); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mi[disabled] { opacity: 0.35; cursor: default; }
.mi .num { color: var(--dim); margin-right: 10px; }

#fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; z-index: 20; transition: opacity 1s ease; }
#fade.white { background: #fbf6ee; }

@media (max-width: 640px) {
  #hud { width: 200px; height: 84px; }
  #hint { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  #grain { animation: none; }
  #narrLine .w { transition: opacity 0.3s; filter: none; transform: none; }
}

/* finale: daylight */
#app.light #narrLine { color: #2a1f22; text-shadow: none; }
#app.light #narr { top: 70%; }
#app.light #narrNext, #app.light #hint, #app.light #goal { color: #2a1f22; text-shadow: none; }
#app.light .cell i { background: rgba(42,31,34,0.1); }
#app.light .cell i.on { background: #e9c9a8; box-shadow: 0 0 8px rgba(226,119,59,0.6); }
#app.light #vignette { opacity: 0.25; }

    </div>
  </section>

  <div id="fade"></div>
</div>
<script>"use strict";
/* ============================================================
   DualSense over WebHID
   Input:  USB report 0x01 (63 bytes) / BT report 0x31 (77 bytes, +1 offset)
   Output: USB report 0x02 (63 bytes) / BT report 0x31 (77 bytes + CRC32)
   Layouts follow the Linux hid-playstation driver.
   ============================================================ */
const DS_VENDOR = 0x054c;
const DS_PRODUCTS = [0x0ce6, 0x0df2]; // DualSense, DualSense Edge

/* ---------- CRC32 (for Bluetooth output reports) ---------- */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes, seed = 0xffffffff) {
  let c = seed;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return c >>> 0;
}

/* ---------- Trigger effects (11 bytes each) ----------
   Encodings from Nielk1's TriggerEffectGenerator (public domain),
   which is what most DualSense tools use. Positions are 10 zones (0-9). */
const Trig = {
  off() { const a = new Uint8Array(11); a[0] = 0x05; return a; },
  // Same force (1-8) from `position` to the end of travel.
  feedback(position, strength) {
    const s = new Array(10).fill(0);
    for (let i = position; i < 10; i++) s[i] = strength;
    return Trig.zones(0x21, s);
  },
  // Per-zone force profile, each 0-8 (0 = free).
  profile(strengths) { return Trig.zones(0x21, strengths); },
  // Vibration from `position` on, amplitude 1-8, frequency 1-255 Hz.
  vibration(position, amplitude, frequency) {
    if (amplitude <= 0 || frequency <= 0) return Trig.off();
    const s = new Array(10).fill(0);
    for (let i = position; i < 10; i++) s[i] = amplitude;
    const a = Trig.zones(0x26, s);
    a[9] = Math.max(1, Math.min(255, frequency | 0));
    return a;
  },
  // A click like a gun trigger: resistance between start (2-7) and end (start+1..8), then gives way.
  weapon(start, end, strength) {
    const a = new Uint8Array(11);
    if (strength <= 0) return Trig.off();
    const z = (1 << start) | (1 << end);
    a[0] = 0x25; a[1] = z & 0xff; a[2] = (z >> 8) & 0xff; a[3] = (strength - 1) & 0x07;
    return a;
  },
  zones(mode, strengths) {
    const a = new Uint8Array(11);
    let force = 0, active = 0, any = false;
    for (let i = 0; i < 10; i++) {
      const v = Math.max(0, Math.min(8, Math.round(strengths[i] || 0)));
      if (v > 0) {
        force = (force | (((v - 1) & 0x07) << (3 * i))) >>> 0;
        active |= 1 << i;
        any = true;
      }
    }
    if (!any) return Trig.off();
    a[0] = mode;
    a[1] = active & 0xff; a[2] = (active >> 8) & 0xff;
    a[3] = force & 0xff; a[4] = (force >>> 8) & 0xff; a[5] = (force >>> 16) & 0xff; a[6] = (force >>> 24) & 0xff;
    return a;
  },
};

/* ---------- Output report builders ---------- */
// Returns the 47-byte "common" block.
function buildCommon(st, first) {
  const c = new Uint8Array(47);
  c[0] = 0x01 | 0x02 | 0x04 | 0x08;      // compatible vibration, haptics select, right trigger, left trigger
  c[1] = 0x01 | 0x04 | 0x10;             // mic LED, lightbar, player LEDs
  c[2] = clampByte(st.rumbleR * 255);    // right motor (light, high frequency)
  c[3] = clampByte(st.rumbleL * 255);    // left motor (heavy, low frequency)
  c[8] = st.micLed | 0;                  // 0 off, 1 on, 2 pulse
  c.set(st.trigR, 10);
  c.set(st.trigL, 21);
  if (first) { c[38] = 0x02; c[41] = 0x02; } // lightbar setup: fade out the boot animation so we own the lightbar
  c[42] = 0x00;                          // player LED brightness: high
  c[43] = st.playerLeds & 0x1f;
  c[44] = clampByte(st.light[0]); c[45] = clampByte(st.light[1]); c[46] = clampByte(st.light[2]);
  return c;
}
function buildUSB(st, first) {
  const d = new Uint8Array(63);
  d.set(buildCommon(st, first), 0);
  return d; // sent with report id 0x02
}
function buildBT(st, first, seq) {
  const d = new Uint8Array(77);
  d[0] = (seq & 0x0f) << 4;
  d[1] = 0x10;
  d.set(buildCommon(st, first), 2);
  const pre = new Uint8Array(1 + 1 + 73);
  pre[0] = 0xa2; pre[1] = 0x31; pre.set(d.subarray(0, 73), 2);
  const crc = crc32(pre) ^ 0xffffffff;
  const v = new DataView(d.buffer);
  v.setUint32(73, crc >>> 0, true);
  return d; // sent with report id 0x31
}
function clampByte(v) { return Math.max(0, Math.min(255, Math.round(v || 0))); }

/* ---------- Input parsing ---------- */
// dv: DataView of the report data (without report id); o: offset of the common struct.
function parseFull(dv, o, out) {
  out.lx = dv.getUint8(o + 0); out.ly = dv.getUint8(o + 1);
  out.rx = dv.getUint8(o + 2); out.ry = dv.getUint8(o + 3);
  out.l2 = dv.getUint8(o + 4); out.r2 = dv.getUint8(o + 5);
  const b0 = dv.getUint8(o + 7), b1 = dv.getUint8(o + 8), b2 = dv.getUint8(o + 9);
  parseButtons(b0, b1, b2, out.btn);
  out.gyro[0] = dv.getInt16(o + 15, true); out.gyro[1] = dv.getInt16(o + 17, true); out.gyro[2] = dv.getInt16(o + 19, true);
  out.accel[0] = dv.getInt16(o + 21, true); out.accel[1] = dv.getInt16(o + 23, true); out.accel[2] = dv.getInt16(o + 25, true);
  out.sensorTime = dv.getUint32(o + 27, true);
  for (let i = 0; i < 2; i++) {
    const p = o + 32 + i * 4;
    const c = dv.getUint8(p), x0 = dv.getUint8(p + 1), x1 = dv.getUint8(p + 2), y1 = dv.getUint8(p + 3);
    const t = out.touch[i];
    t.active = (c & 0x80) === 0;
    t.id = c & 0x7f;
    t.x = x0 | ((x1 & 0x0f) << 8);
    t.y = (x1 >> 4) | (y1 << 4);
  }
  const status = dv.getUint8(o + 52);
  out.battery = Math.min(100, (status & 0x0f) * 10 + 5);
  out.charging = (status & 0xf0) >> 4;
  out.full = true;
}
// Bluetooth "simple" report 0x01 (before the controller switches to full reports).
function parseSimple(dv, out) {
  out.lx = dv.getUint8(0); out.ly = dv.getUint8(1); out.rx = dv.getUint8(2); out.ry = dv.getUint8(3);
  parseButtons(dv.getUint8(4), dv.getUint8(5), dv.getUint8(6), out.btn);
  out.l2 = dv.getUint8(7); out.r2 = dv.getUint8(8);
  out.full = false;
}
function parseButtons(b0, b1, b2, btn) {
  const hat = b0 & 0x0f;
  btn.up = hat === 0 || hat === 1 || hat === 7;
  btn.right = hat === 1 || hat === 2 || hat === 3;
  btn.down = hat === 3 || hat === 4 || hat === 5;
  btn.left = hat === 5 || hat === 6 || hat === 7;
  btn.square = !!(b0 & 0x10); btn.cross = !!(b0 & 0x20); btn.circle = !!(b0 & 0x40); btn.triangle = !!(b0 & 0x80);
  btn.l1 = !!(b1 & 0x01); btn.r1 = !!(b1 & 0x02);
  btn.create = !!(b1 & 0x10); btn.options = !!(b1 & 0x20); btn.l3 = !!(b1 & 0x40); btn.r3 = !!(b1 & 0x80);
  btn.ps = !!(b2 & 0x01); btn.touch = !!(b2 & 0x02); btn.mute = !!(b2 & 0x04);
}

/* ---------- Device wrapper ---------- */
class DualSense {
  constructor() {
    this.device = null;
    this.bt = false;
    this.edge = false;
    this.connected = false;
    this.lastReportAt = 0;
    this.reports = 0;
    this.state = {
      lx: 128, ly: 128, rx: 128, ry: 128, l2: 0, r2: 0, btn: {},

    const K = Object.assign({}, this.keys, this.taps), P = this.pointer;
    this.taps = {};
    let kx = (K.KeyD || K.ArrowRight ? 1 : 0) - (K.KeyA || K.ArrowLeft ? 1 : 0);
    let ky = (K.KeyS || K.ArrowDown ? 1 : 0) - (K.KeyW || K.ArrowUp ? 1 : 0);
    if (kx || ky) { const m = Math.hypot(kx, ky); this.lx = kx / m; this.ly = ky / m; if (!srcSet) this.source = 'keyboard'; }
    let jx = (K.KeyL ? 1 : 0) - (K.KeyJ ? 1 : 0), jy = (K.KeyK ? 1 : 0) - (K.KeyI ? 1 : 0);
    if (jx || jy) { this.rx = jx; this.ry = jy; }
    const wantR2 = K.Space || (P.down && this.mouseTriggers);
    const wantL2 = K.ShiftLeft || K.ShiftRight || P.right;
    this._kbR2 += ((wantR2 ? 1 : 0) - this._kbR2) * Math.min(1, dt * (wantR2 ? 3.2 : 14));
    this._kbL2 += ((wantL2 ? 1 : 0) - this._kbL2) * Math.min(1, dt * (wantL2 ? 4 : 14));
    if (this._kbR2 > 0.01) this.r2 = Math.max(this.r2, this._kbR2 > 0.985 ? 1 : this._kbR2);
    if (this._kbL2 > 0.01) this.l2 = Math.max(this.l2, this._kbL2 > 0.985 ? 1 : this._kbL2);
    if (K.Enter || K.Space || K.KeyE) h.cross = true;
    if (K.Escape || K.KeyP) h.options = true;
    if (K.Backspace || K.KeyQ) h.circle = true;
    if (K.KeyR) h.triangle = true;
    if (K.KeyZ) h.l1 = true; if (K.KeyC) h.r1 = true;
    if (K.ArrowUp) h.up = true; if (K.ArrowDown) h.down = true; if (K.ArrowLeft) h.left = true; if (K.ArrowRight) h.right = true;
    this.held = h;
  },

  endFrame() {
    this.pointer.dx = 0; this.pointer.dy = 0; this.pointer.wheel = 0; this.pointer.moved = 0;
  },

  readMotion(s, dt) {
    // Raw: gyro 1024 counts per deg/s, accel 8192 counts per g (hid-playstation resolution).
    const g = [s.gyro[0] / 1024, s.gyro[1] / 1024, s.gyro[2] / 1024];
    const a = [s.accel[0] / 8192, s.accel[1] / 8192, s.accel[2] / 8192];
    // Learn gyro bias while the controller rests (rate small and accel near 1g).
    const mag = Math.hypot(g[0] - this.gyroBias[0], g[1] - this.gyroBias[1], g[2] - this.gyroBias[2]);
    const amag = Math.hypot(a[0], a[1], a[2]);
    if (mag < 4 && Math.abs(amag - 1) < 0.06) {
      this._stillT += dt;
      if (this._stillT > 0.4) {
        const k = this._biasN < 60 ? 1 / (++this._biasN) : 0.02;
        for (let i = 0; i < 3; i++) this.gyroBias[i] += (g[i] - this.gyroBias[i]) * k;
      }
    } else this._stillT = 0;
    for (let i = 0; i < 3; i++) this.gyro[i] = g[i] - this.gyroBias[i];
    for (let i = 0; i < 3; i++) this.accel[i] += (a[i] - this.accel[i]) * Math.min(1, dt * 30);
  },

  // Aim deltas (degrees this frame) from gyro: yaw blends Y and Z so it works however the pad is held.
  gyroAim(dt) {
    if (!this.hasMotion) return [0, 0];
    const st = this.settings;
    const yaw = this.gyro[1] * dt * (st.invertGyroX ? -1 : 1) * this._yawSign;
    const pitch = this.gyro[0] * dt * (st.invertGyroY ? -1 : 1) * this._pitchSign;
    return [yaw * st.gyroSens, pitch * st.gyroSens];
  },
  _yawSign: -1, _pitchSign: -1,

  pressed(n) { return !!this.held[n] && !this.prev[n]; },
  released(n) { return !this.held[n] && !!this.prev[n]; },
  any() { return BTN_NAMES.some((n) => this.pressed(n)); },

  // Glyphs for prompts
  glyph(n) {
    const kb = this.source === 'keyboard';
    if (kb) {
      const pt = I18N.lang === 'pt';
      return ({ cross: pt ? 'Enter' : 'Enter', r2: pt ? 'Espaço' : 'Space', l2: 'Shift', options: 'Esc', circle: 'Q', touch: pt ? 'mouse' : 'mouse', rs: pt ? 'mouse' : 'mouse', ls: 'WASD' })[n] || n;
    }
    if (this.padKind === 'ps') return ({ cross: '✕', circle: '○', square: '□', triangle: '△', r2: 'R2', l2: 'L2', r1: 'R1', l1: 'L1', options: 'OPTIONS', touch: 'touchpad', rs: 'R3', ls: 'L3' })[n] || n;
    return ({ cross: 'A', circle: 'B', square: 'X', triangle: 'Y', r2: 'RT', l2: 'LT', r1: 'RB', l1: 'LB', options: 'Menu', touch: 'stick', rs: 'RS', ls: 'LS' })[n] || n;
  },
};

/* ============================================================
   Haptics mixer
   - Continuous rumble channels + timed pulses, mixed each frame
   - Trigger effects as descriptors (re-encoded with the strength setting)
   - Lightbar (smoothed), player LEDs, mic LED
   - Fallback: Gamepad API dual-rumble / trigger-rumble (Xbox on Windows)
   ============================================================ */
const Haptics = {
  channels: {},          // name -> [l, r]
  pulses: [],            // {l, r, t, dur, shape}
  trig: { L: { type: 'off' }, R: { type: 'off' } },
  light: [30, 30, 50], lightTarget: [30, 30, 50], lightRate: 6,
  playerLeds: 0, micLed: 0,
  outL: 0, outR: 0,
  settings: { rumble: 1, triggers: 1, enabled: true },
  _gpT: 0, _gpLast: '',

  set(name, l, r) { if (l <= 0 && r <= 0) delete this.channels[name]; else this.channels[name] = [l, r]; },
  clear(name) { delete this.channels[name]; },
  // shape: 'flat' | 'decay' | 'bump'
  pulse(l, r, dur = 0.08, shape = 'decay') { this.pulses.push({ l, r, t: 0, dur, shape }); },
  setTrigger(side, desc) { this.trig[side] = desc || { type: 'off' }; },
  setLight(rgb, rate = 6) { this.lightTarget = rgb.slice(0, 3); this.lightRate = rate; },
  lightNow(rgb) { this.lightTarget = rgb.slice(0, 3); this.light = rgb.slice(0, 3); },
  allOff() {
    this.channels = {}; this.pulses = [];
    this.trig.L = { type: 'off' }; this.trig.R = { type: 'off' };
    this.micLed = 0;
  },

  encode(d) {
    const k = this.settings.triggers;
    const sc = (v) => (v <= 0 ? 0 : Math.max(1, Math.min(8, Math.round(v * k))));
    if (!this.settings.enabled || k <= 0) return Trig.off();
    switch (d.type) {
      case 'profile': return Trig.profile(d.s.map(sc));
      case 'feedback': return Trig.feedback(d.pos, sc(d.str));
      case 'vibration': return Trig.vibration(d.pos, sc(d.amp), d.freq);
      case 'weapon': return Trig.weapon(d.start, d.end, sc(d.str));
      default: return Trig.off();
    }
  },

  update(dt) {
    let l = 0, r = 0;
    for (const n in this.channels) { const c = this.channels[n]; l += c[0]; r += c[1]; }
    for (let i = this.pulses.length - 1; i >= 0; i--) {
      const p = this.pulses[i];
      p.t += dt;
      const u = p.t / p.dur;
      if (u >= 1) { this.pulses.splice(i, 1); continue; }
      const env = p.shape === 'flat' ? 1 : p.shape === 'bump' ? Math.sin(u * Math.PI) : (1 - u) * (1 - u);
      l += p.l * env; r += p.r * env;
    }
    const k = this.settings.enabled ? this.settings.rumble : 0;
    this.outL = Math.min(1, l * k); this.outR = Math.min(1, r * k);
    const a = Math.min(1, dt * this.lightRate);
    for (let i = 0; i < 3; i++) this.light[i] += (this.lightTarget[i] - this.light[i]) * a;

    const ds = Input.ds;
    if (ds.connected) {
      const o = ds.out;
      o.rumbleL = Math.round(this.outL * 40) / 40;
      o.rumbleR = Math.round(this.outR * 40) / 40;
      o.trigL = this.encode(this.trig.L);
      o.trigR = this.encode(this.trig.R);
      o.light = this.light.map((v) => Math.round(v));
      o.playerLeds = this.playerLeds;
      o.micLed = this.micLed;
      ds.flush();
    } else if (Input._gp && Input.source === 'gamepad') {
      this.gamepadFallback(dt);
    }
  },

  gamepadFallback(dt) {
    const gp = Input._gp, act = gp && gp.vibrationActuator;
    if (!act || !act.playEffect) return;
    this._gpT -= dt;
    // Approximate trigger effects with trigger rumble where the browser supports it (Xbox on Windows).
    const tv = (d) => {
      if (!d || d.type === 'off') return 0;
      if (d.type === 'vibration') return Math.min(1, (d.amp / 8) * 0.6);
      return 0;
    };
    const lt = tv(this.trig.L) * Input.l2, rt = tv(this.trig.R) * Input.r2;
    const key = [this.outL.toFixed(2), this.outR.toFixed(2), lt.toFixed(2), rt.toFixed(2)].join();
    if (this._gpT > 0 && key === this._gpLast) return;
    this._gpT = 0.09; this._gpLast = key;
    const eff = act.effects || [];
    const params = { startDelay: 0, duration: 140, strongMagnitude: this.outL, weakMagnitude: this.outR };
    try {
      if (eff.includes && eff.includes('trigger-rumble')) act.playEffect('trigger-rumble', Object.assign(params, { leftTrigger: lt, rightTrigger: rt }));
      else if (this.outL + this.outR > 0.001) act.playEffect('dual-rumble', params);
    } catch (e) { /* ignore */ }
  },

  // Called on pause / leave
  quiet() {
    const ds = Input.ds;
    if (ds.connected) { ds.out.rumbleL = 0; ds.out.rumbleR = 0; ds.out.trigL = Trig.off(); ds.out.trigR = Trig.off(); ds.flush(); }
  },

  setProgress(n) {
    this.playerLeds = [0, 0x01, 0x03, 0x07, 0x0f, 0x1f][Math.max(0, Math.min(5, n))];
  },
};

addEventListener('pagehide', () => { try { Input.ds.reset(); } catch (e) {} });
document.addEventListener('visibilitychange', () => { if (document.hidden) Haptics.quiet(); });

/* ============================================================
   Audio: everything synthesized live with WebAudio.
   Master -> compressor -> out, with a generated-impulse reverb send.
   ============================================================ */
const Sound = {
  ctx: null, master: null, rev: null, revIn: null, dry: null, noiseBuf: null,
  volume: 0.8, started: false,

  start() {
    if (this.started) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.started = true;
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    this.master = c.createGain(); this.master.gain.value = this.volume;
    this.master.connect(comp); comp.connect(c.destination);
    this.dry = c.createGain(); this.dry.connect(this.master);
    this.rev = c.createConvolver(); this.rev.buffer = this.impulse(2.4, 2.8);
    this.revIn = c.createGain(); this.revIn.gain.value = 1;
    const revOut = c.createGain(); revOut.gain.value = 0.55;
    this.revIn.connect(this.rev); this.rev.connect(revOut); revOut.connect(this.master);
    const len = c.sampleRate * 2;
    this.noiseBuf = c.createBuffer(1, len, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  setVolume(v) { this.volume = v; if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.05); },
  impulse(sec, decay) {
    const c = this.ctx, n = Math.floor(c.sampleRate * sec), b = c.createBuffer(2, n, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = b.getChannelData(ch);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
    }
    return b;
  },
  get t() { return this.ctx ? this.ctx.currentTime : 0; },
  ok() { return this.started && this.ctx && this.ctx.state !== 'closed'; },

  // Routing helper: node -> dry + reverb send
  out(node, wet = 0.2, dryAmt = 1, pan = 0) {
    const c = this.ctx;
    let n = node;
    if (pan && c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); n.connect(p); n = p; }
    if (dryAmt > 0) { const g = c.createGain(); g.gain.value = dryAmt; n.connect(g); g.connect(this.dry); }
    if (wet > 0) { const g = c.createGain(); g.gain.value = wet; n.connect(g); g.connect(this.revIn); }
    return n;
  },
  env(g, t, a, peak, d, sus = 0, rel = 0.1, hold = 0) {
    g.gain.cancelScheduledValues(t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, sus || 0.0001), t + a + d);
    if (sus) g.gain.setValueAtTime(sus, t + a + d + hold);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d + hold + rel);
  },
  tone(freq, { type = 'sine', a = 0.005, d = 0.3, peak = 0.3, wet = 0.25, pan = 0, at = 0, detune = 0, glide = 0, filter = 0 } = {}) {
    if (!this.ok()) return;
    const c = this.ctx, t = this.t + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.detune.value = detune;
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * glide), t + a + d);
    let src = o;
    if (filter) { const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter; o.connect(f); src = f; }
    src.connect(g);
    this.env(g, t, a, peak, d);
    this.out(g, wet, 1, pan);
    o.start(t); o.stop(t + a + d + 0.05);
  },
  noise({ a = 0.002, d = 0.1, peak = 0.3, type = 'bandpass', freq = 1000, q = 1, wet = 0.1, pan = 0, at = 0, sweep = 0 } = {}) {
    if (!this.ok()) return;
    const c = this.ctx, t = this.t + at;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweep) f.frequency.exponentialRampToValueAtTime(Math.max(30, freq * sweep), t + a + d);
    const g = c.createGain();
    s.connect(f); f.connect(g);
    this.env(g, t, a, peak, d);
    this.out(g, wet, 1, pan);
    s.start(t, Math.random() * 1.5); s.stop(t + a + d + 0.05);
  },

  /* ---------- Continuous voices ---------- */
  // Filtered noise bed with live gain/filter control
  noiseVoice({ type = 'lowpass', freq = 800, q = 0.7, wet = 0.2, pan = 0 } = {}) {
    if (!this.ok()) return null;
    const c = this.ctx;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.value = 0;
    s.connect(f); f.connect(g); this.out(g, wet, 1, pan);
    s.start();
    return {
      set(gain, fr, qq) { const t = c.currentTime; g.gain.setTargetAtTime(gain, t, 0.04); if (fr) f.frequency.setTargetAtTime(fr, t, 0.04); if (qq) f.Q.setTargetAtTime(qq, t, 0.05); },
      stop(fade = 0.4) { const t = c.currentTime; g.gain.setTargetAtTime(0, t, fade / 4); s.stop(t + fade + 0.1); },
    };
  },
  // Pad drone: chord of detuned saws through a slow lowpass
  pad(freqs, { gain = 0.05, cutoff = 900, wet = 0.6, type = 'sawtooth' } = {}) {
    if (!this.ok()) return null;
    const c = this.ctx;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; f.Q.value = 0.4;
    const g = c.createGain(); g.gain.value = 0;
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 0.07; lg.gain.value = cutoff * 0.35; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    const oscs = [];
    freqs.forEach((fr, i) => {
      for (const det of [-7, 6]) {
        const o = c.createOscillator(); o.type = type; o.frequency.value = fr; o.detune.value = det + (i % 2 ? 2 : -2);
        o.connect(f); o.start(); oscs.push(o);
      }
    });
    f.connect(g); this.out(g, wet, 0.6);
    g.gain.setTargetAtTime(gain, c.currentTime, 1.2);
    return {
      to(newFreqs, time = 2) {
        const t = c.currentTime;
        newFreqs.forEach((fr, i) => { [oscs[i * 2], oscs[i * 2 + 1]].forEach((o) => o && o.frequency.setTargetAtTime(fr, t, time / 3)); });
      },
      level(v, time = 1) { g.gain.setTargetAtTime(v, c.currentTime, time / 3); },
      cutoff(v, time = 1) { f.frequency.setTargetAtTime(v, c.currentTime, time / 3); },
      stop(fade = 2) { const t = c.currentTime; g.gain.setTargetAtTime(0, t, fade / 4); oscs.forEach((o) => o.stop(t + fade + 0.2)); lfo.stop(t + fade + 0.2); },
    };
  },
  // Engine: two saws + square sub, pitch from RPM, throttle opens the filter
  engine() {
    if (!this.ok()) return null;
    const c = this.ctx;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 400; f.Q.value = 3;
    const ws = c.createWaveShaper(); const curve = new Float32Array(1024);
    for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 2.2); }
    ws.curve = curve;
    const g = c.createGain(); g.gain.value = 0;
    const o1 = c.createOscillator(), o2 = c.createOscillator(), o3 = c.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'sawtooth'; o3.type = 'square';
    o2.detune.value = 9;
    const g3 = c.createGain(); g3.gain.value = 0.5;
    const amNode = c.createGain(); amNode.gain.value = 0.75;
    o1.connect(ws); o2.connect(ws); o3.connect(g3); g3.connect(ws); ws.connect(f); f.connect(amNode); amNode.connect(g);
    // amplitude wobble = cylinder firing texture
    const am = c.createOscillator(), amg = c.createGain(); am.type = 'square'; amg.gain.value = 0.25; am.connect(amg); amg.connect(amNode.gain);
    this.out(g, 0.12, 1);
    [o1, o2, o3, am].forEach((o) => o.start());
    return {
      set(rpm, thr, vol = 1) {
        const t = c.currentTime, base = rpm / 60 * 2; // 4-cyl: 2 firings per rev
        o1.frequency.setTargetAtTime(base, t, 0.03); o2.frequency.setTargetAtTime(base * 1.005, t, 0.03); o3.frequency.setTargetAtTime(base / 2, t, 0.03);
        am.frequency.setTargetAtTime(base / 2, t, 0.03);
        f.frequency.setTargetAtTime(260 + thr * 1800 + rpm * 0.12, t, 0.05);
        g.gain.setTargetAtTime((0.05 + thr * 0.07) * vol, t, 0.05);
      },
      stop(fade = 0.6) { const t = c.currentTime; g.gain.setTargetAtTime(0, t, fade / 4); [o1, o2, o3, am].forEach((o) => o.stop(t + fade + 0.2)); },
    };
  },

  /* ---------- One-shots ---------- */
  ui() { this.tone(1320, { type: 'sine', d: 0.07, peak: 0.08, wet: 0.2 }); },
  confirm() { this.tone(660, { d: 0.12, peak: 0.12 }); this.tone(990, { d: 0.25, peak: 0.1, at: 0.06 }); },
  dot(i) { const n = [523.25, 587.33, 659.25, 783.99, 880, 1046.5][i % 6]; this.tone(n, { type: 'triangle', d: 1.4, peak: 0.16, wet: 0.7 }); this.tone(n * 2, { d: 1.0, peak: 0.05, wet: 0.8, at: 0.02 }); },
  chime(i, pan = 0) {
    const scale = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21, 24];
    const f = 392 * Math.pow(2, scale[i % scale.length] / 12);
    this.tone(f, { type: 'sine', d: 2.2, peak: 0.18, wet: 0.8, pan });
    this.tone(f * 2.01, { type: 'sine', d: 1.2, peak: 0.05, wet: 0.9, pan, at: 0.01 });
    this.tone(f * 3, { type: 'triangle', d: 0.6, peak: 0.03, wet: 0.9, pan });
  },
  twang(power) {
    this.tone(90 + power * 70, { type: 'triangle', d: 0.35, peak: 0.25 * (0.4 + power), glide: 0.6, wet: 0.2 });
    this.noise({ d: 0.12, peak: 0.12 * power, freq: 3000, q: 0.8, sweep: 0.3 });
  },
  whoosh(power = 1, pan = 0) { this.noise({ a: 0.03, d: 0.5, peak: 0.1 * power, freq: 1200, q: 1.2, sweep: 0.25, pan, wet: 0.3 }); },
  ignite(pan = 0) { this.noise({ a: 0.01, d: 0.6, peak: 0.12, type: 'highpass', freq: 2500, q: 0.5, pan, wet: 0.5 }); },
  click(strength = 0.5) {
    this.noise({ a: 0.0005, d: 0.018, peak: 0.12 * strength + 0.02, freq: 4200, q: 4, wet: 0.05 });
    this.tone(2400, { type: 'square', a: 0.0005, d: 0.01, peak: 0.02 * strength, wet: 0 });
  },
  clunk() {
    this.tone(140, { type: 'triangle', a: 0.001, d: 0.12, peak: 0.35, glide: 0.5, wet: 0.15 });
    this.noise({ a: 0.001, d: 0.06, peak: 0.2, freq: 900, q: 2, wet: 0.1 });
  },
  thunk() {
    this.tone(70, { type: 'sine', a: 0.002, d: 0.4, peak: 0.6, glide: 0.5, wet: 0.3 });
    this.noise({ a: 0.001, d: 0.2, peak: 0.25, type: 'lowpass', freq: 600, wet: 0.3 });
  },
  buzz() { this.tone(110, { type: 'sawtooth', d: 0.25, peak: 0.08, filter: 700, wet: 0.1 }); },
  bump(v, pan = 0) {
    this.tone(90 + v * 40, { type: 'sine', a: 0.001, d: 0.09, peak: 0.25 * v, glide: 0.6, pan, wet: 0.1 });
    this.noise({ a: 0.001, d: 0.04, peak: 0.12 * v, freq: 1500, q: 1.5, pan, wet: 0.05 });
  },

  const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));

/* ---------- Async flow with cancellation ---------- */
class Cancel extends Error {}
const Flow = {
  gen: 0, waiters: [], time: 0,
  wait(sec) { const g = this.gen, end = this.time + sec; return new Promise((res, rej) => this.waiters.push({ g, test: () => this.time >= end, res, rej })); },
  until(fn) { const g = this.gen; return new Promise((res, rej) => this.waiters.push({ g, test: fn, res, rej })); },
  tick() {
    for (let i = this.waiters.length - 1; i >= 0; i--) {
      const w = this.waiters[i];
      if (w.g !== this.gen) { this.waiters.splice(i, 1); w.rej(new Cancel()); continue; }
      let ok = false;
      try { ok = w.test(); } catch (e) { ok = true; }
      if (ok) { this.waiters.splice(i, 1); w.res(); }
    }
  },
  cancel() { this.gen++; this.tick(); },
};
const wait = (s) => Flow.wait(s);
const until = (f) => Flow.until(f);

/* ---------- UI ---------- */
const UI = {
  narrating: false,
  async say(lines, opts = {}) {
    if (!Array.isArray(lines)) lines = [lines];
    const el = $('narrLine'), nx = $('narrNext');
    this.narrating = true;
    try {
      for (const line of lines) {
        el.classList.remove('out');
        el.innerHTML = '';
        const words = line.split(' ');
        const spans = words.map((w, i) => { const s = document.createElement('span'); s.className = 'w'; s.textContent = w + (i < words.length - 1 ? ' ' : ''); el.appendChild(s); return s; });
        const per = opts.slow ? 0.16 : 0.1;
        const start = Flow.time;
        let shown = 0;
        await until(() => {
          const n = Math.min(spans.length, Math.floor((Flow.time - start) / per) + 1);
          while (shown < n) { spans[shown].classList.add('in'); if (shown % 3 === 0) Sound.tone(220 + Math.random() * 20, { type: 'sine', d: 0.25, peak: 0.012, wet: 0.6 }); shown++; }
          if (Input.pressed('cross') && Flow.time - start > 0.25) { spans.forEach((s) => s.classList.add('in')); shown = spans.length; return true; }
          return shown >= spans.length;
        });
        nx.textContent = T('next', { b: Input.glyph('cross') });
        const hold = opts.hold ?? clamp(words.length * 0.28 + 1.4, 2.4, 6);
        const t0 = Flow.time;
        await wait(0.2);
        nx.classList.add('on');
        await until(() => Input.pressed('cross') || Flow.time - t0 > hold);
        nx.classList.remove('on');
        Sound.ui();
        el.classList.add('out');
        await wait(0.5);
      }
    } finally {
      el.innerHTML = ''; el.classList.remove('out'); nx.classList.remove('on');
      this.narrating = false;
    }
  },

const PLACES = [
  { key: 'p1', scene: () => SceneTouch },
  { key: 'p2', scene: () => SceneBow },
  { key: 'p3', scene: () => SceneDrive },
  { key: 'p4', scene: () => SceneSafe },
  { key: 'p5', scene: () => SceneTilt },
];

async function runGame(from = 0) {
  Game.started = true;
  Game.stats = { start: Flow.time, shots: 0, top: 0, ticks: 0 };
  $('cell').hidden = false;
  UI.setDots(from);
  Haptics.setProgress(from);
  try {
    if (from === 0) {
      await Game.transition(SceneVoid);
      await wait(0.6);
      await UI.say(T('intro'), { slow: true });
    }
    for (let i = from; i < 5; i++) await runPlace(i);
    await runFinale();
  } catch (e) {
    if (!(e instanceof Cancel)) { console.error(e); throw e; }
  }
}

async function runPlace(i) {
  const P = PLACES[i], scene = P.scene();
  Game.playIdx = i;
  await Game.transition(scene);
  await UI.card(i, T(P.key + 'name'));
  await UI.say(T(P.key + 'in'));
  Game.inPlay = true;
  Game.skipReq = false;
  await scene.play();
  Game.inPlay = false;
  UI.hint(''); UI.goal('');
  Game.progress = Math.max(Game.progress, i + 1);
  store('progress', Math.max(store('progress') || 0, i + 1));
  UI.setDots(i + 1, i);
  Haptics.setProgress(i + 1);
  Sound.dot(i);
  Haptics.pulse(0.5, 0.3, 0.35, 'bump');
  await wait(1.2);
  if (scene.afterPlay) await scene.afterPlay();
  await UI.say(T(P.key + 'out'));
}

      { l: T('volume'), v: pct(Sound.volume), adj: (d) => { Sound.setVolume(clamp(Math.round((Sound.volume + d * 0.1) * 10) / 10, 0, 1)); Sound.ui(); } },
      { l: T('hudOpt'), v: yn(HUD.on), act: () => { HUD.on = !HUD.on; store('hud', HUD.on); } },
      { l: T('textSize'), v: yn(document.body.classList.contains('bigtext')), act: () => document.body.classList.toggle('bigtext') },
      { l: T('invX'), v: yn(Input.settings.invertGyroX), act: () => { Input.settings.invertGyroX = !Input.settings.invertGyroX; } },
      { l: T('invY'), v: yn(Input.settings.invertGyroY), act: () => { Input.settings.invertGyroY = !Input.settings.invertGyroY; } },
      { l: T('language'), v: '', act: () => { I18N.set(I18N.lang === 'pt' ? 'en' : 'pt'); } },
    ];
    if (Game.inPlay) this.items.push({ l: T('skip'), v: '', act: () => { Game.skipReq = true; this.close(); } });
    this.items.push({ l: T('toTitle'), v: '', act: () => { this.close(); toTitle(); } });
    const list = $('menuList'); list.innerHTML = '';
    this.items.forEach((it, i) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'mi' + (i === this.idx ? ' focus' : '');
      b.innerHTML = `<span>${it.l}</span><span class="v">${it.adj ? '◂ ' + it.v + ' ▸' : it.v}</span>`;
      b.onclick = (e) => { this.idx = i; if (it.adj) { const r = b.getBoundingClientRect(); it.adj(e.clientX > r.left + r.width / 2 ? 1 : -1); } else it.act(); if (!$('menu').hidden) this.build(); };
      list.appendChild(b);
    });
  },
  update() {
    if ($('menu').hidden) return;
    const n = this.items.length;
    if (Input.pressed('down') || (Input.ly > 0.6 && !this._ly)) { this.idx = (this.idx + 1) % n; Sound.ui(); this.build(); }
    if (Input.pressed('up') || (Input.ly < -0.6 && !this._ly)) { this.idx = (this.idx + n - 1) % n; Sound.ui(); this.build(); }
    this._ly = Math.abs(Input.ly) > 0.6;
    const it = this.items[this.idx];
    if (it.adj && (Input.pressed('right') || Input.pressed('left'))) { it.adj(Input.pressed('right') ? 1 : -1); this.build(); }
    if (Input.pressed('cross')) { if (it.adj) it.adj(1); else it.act(); if (!$('menu').hidden) this.build(); }
    if (Input.pressed('circle')) this.close();
  },
};

function toTitle() {
  Flow.cancel();
  Game.inPlay = false; Game.started = false; Game.paused = false;
  UI.hint(''); UI.goal('');
  $('narrLine').innerHTML = ''; $('card').hidden = true; $('cell').hidden = true;
  Game.setScene(SceneVoid);
  Haptics.allOff();
  $('fade').style.opacity = 0;
  $('title').hidden = false;
  Title.texts();
}

/* ---------- A dark, breathing space for in-between moments ---------- */
const SceneVoid = {
  t: 0, motes: [],
  enter() {
    this.t = 0;
    this.motes = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), z: rand(0.3, 1), p: rand(0, TAU) }));
    Haptics.setLight([30, 24, 40], 2);
    this.pad = Sound.pad([65.4, 98, 130.8, 155.6], { gain: 0.035, cutoff: 500 });
  },
  exit() { if (this.pad) this.pad.stop(2.5); this.pad = null; },
  update(dt) { this.t += dt; },
  render(g, W, H) {
    g.fillStyle = '#0e0c12'; g.fillRect(0, 0, W, H);
    const gr = g.createRadialGradient(W / 2, H * 0.55, 10, W / 2, H * 0.55, Math.max(W, H) * 0.6);
    gr.addColorStop(0, 'rgba(60,40,60,0.35)'); gr.addColorStop(1, 'rgba(14,12,18,0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    for (const m of this.motes) {
      const y = ((m.y - this.t * 0.006 * m.z) % 1 + 1) % 1;
      const x = m.x + Math.sin(this.t * 0.2 + m.p) * 0.01;
      const a = (Math.sin(this.t * 0.8 + m.p) * 0.5 + 0.5) * 0.35 * m.z;
      g.fillStyle = `rgba(255,214,170,${a})`;
      g.beginPath(); g.arc(x * W, y * H, 1.2 * m.z + 0.3, 0, TAU); g.fill();
    }
  },
};

/* ---------- Main loop ---------- */
let _last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - _last) / 1000);
  _last = now;
  Input.update(dt);
  if (Game.started && Input.pressed('options')) { if ($('menu').hidden) { Menu.open(); Input.prev.cross = true; } else Menu.close(); }
  Menu.update();
  Title.update(dt);
  const g = View.g;
  g.setTransform(View.dpr, 0, 0, View.dpr, 0, 0);
  try {
    if (!Game.paused) {
      Flow.time += dt;
      if (Game.scene) Game.scene.update(dt);
      Flow.tick();
      UI.tick(dt);
      Haptics.update(dt);
    }
    if (Game.scene) Game.scene.render(g, View.W, View.H);
    HUD.draw(Game.paused ? 0 : dt);
  } catch (e) {
    if (!frame._err || frame._err !== String(e)) { frame._err = String(e); console.error(e); }
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }
  Input.endFrame();
  requestAnimationFrame(frame);
}

function boot() {
  I18N.init();
  View.init();
  Input.init($('app'));
  HUD.init();
  Title.init();
  Game.setScene(SceneVoid);
  $('fade').style.opacity = 0;
  requestAnimationFrame(frame);
  window.TATO = { Game, Input, Haptics, Flow, UI, runPlace, runGame, toTitle };
}

/* ============================================================
   1 · TOQUE — fingers on the touchpad paint into a fluid simulation
   (stable fluids: advection, vorticity, pressure projection) on WebGL2.
   ============================================================ */
const Fluid = {
  gl: null, ok: false,
  init() {
    if (this.gl) return this.ok;
    const cv = $('gl');
    const gl = cv.getContext('webgl2', { alpha: false, antialias: false, depth: false, stencil: false, preserveDrawingBuffer: false });
    if (!gl) return (this.ok = false);
    this.gl = gl;
    if (!gl.getExtension('EXT_color_buffer_float')) { this.ok = false; return false; }
    gl.getExtension('OES_texture_float_linear');
    const vs = `#version 300 es
      precision highp float;
      in vec2 aPos; out vec2 vUv, vL, vR, vT, vB; uniform vec2 texel;
      void main(){ vUv = aPos*0.5+0.5; vL=vUv-vec2(texel.x,0.); vR=vUv+vec2(texel.x,0.); vT=vUv+vec2(0.,texel.y); vB=vUv-vec2(0.,texel.y); gl_Position=vec4(aPos,0.,1.); }`;
    const P = (fs) => this.program(vs, '#version 300 es\nprecision highp float;precision highp sampler2D;\nin vec2 vUv,vL,vR,vT,vB;out vec4 o;\n' + fs);
    this.p = {
      clear: P(`uniform sampler2D uT;uniform float v;void main(){o=v*texture(uT,vUv);}`),
      splat: P(`uniform sampler2D uT;uniform float ar;uniform vec3 color;uniform vec2 pt;uniform float r;
        void main(){vec2 p=vUv-pt;p.x*=ar;vec3 s=exp(-dot(p,p)/r)*color;o=vec4(texture(uT,vUv).xyz+s,1.);}`),
      advect: P(`uniform sampler2D uV,uS;uniform vec2 texel;uniform float dt,diss;
        void main(){vec2 c=vUv-dt*texture(uV,vUv).xy*texel;o=texture(uS,c)/(1.+diss*dt);o.a=1.;}`),
      div: P(`uniform sampler2D uV;void main(){float L=texture(uV,vL).x,R=texture(uV,vR).x,T=texture(uV,vT).y,B=texture(uV,vB).y;
        vec2 C=texture(uV,vUv).xy;if(vL.x<0.)L=-C.x;if(vR.x>1.)R=-C.x;if(vT.y>1.)T=-C.y;if(vB.y<0.)B=-C.y;o=vec4(.5*(R-L+T-B),0.,0.,1.);}`),
      curl: P(`uniform sampler2D uV;void main(){float L=texture(uV,vL).y,R=texture(uV,vR).y,T=texture(uV,vT).x,B=texture(uV,vB).x;o=vec4(.5*(R-L-T+B),0.,0.,1.);}`),
      vort: P(`uniform sampler2D uV,uC;uniform float curl,dt;void main(){float L=texture(uC,vL).x,R=texture(uC,vR).x,T=texture(uC,vT).x,B=texture(uC,vB).x,C=texture(uC,vUv).x;
        vec2 f=.5*vec2(abs(T)-abs(B),abs(R)-abs(L));f/=length(f)+1e-4;f*=curl*C;f.y*=-1.;vec2 v=texture(uV,vUv).xy+f*dt;o=vec4(clamp(v,-1000.,1000.),0.,1.);}`),
      press: P(`uniform sampler2D uP,uD;void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x,d=texture(uD,vUv).x;o=vec4((L+R+B+T-d)*.25,0.,0.,1.);}`),
      grad: P(`uniform sampler2D uP,uV;void main(){float L=texture(uP,vL).x,R=texture(uP,vR).x,T=texture(uP,vT).x,B=texture(uP,vB).x;vec2 v=texture(uV,vUv).xy-vec2(R-L,T-B);o=vec4(v,0.,1.);}`),
      show: P(`uniform sampler2D uS;uniform vec2 texel;uniform vec3 bg;uniform float glow;
        void main(){vec3 c=texture(uS,vUv).rgb;
          vec3 lc=texture(uS,vL).rgb,rc=texture(uS,vR).rgb,tc=texture(uS,vT).rgb,bc=texture(uS,vB).rgb;
          float dx=length(rc)-length(lc),dy=length(tc)-length(bc);
          vec3 n=normalize(vec3(dx,dy,length(texel)*3.));float diff=clamp(dot(n,normalize(vec3(-.4,.6,1.)))+.55,.6,1.25);
          c*=diff;
          vec3 hl=pow(max(c-.6,0.),vec3(2.))*glow;
          c=c+hl;
          c=1.-exp(-c*1.35);
          float vg=smoothstep(1.25,.25,length(vUv-.5)*1.6);
          o=vec4(mix(bg,bg+c,1.)*mix(.75,1.,vg),1.);}`),
    };
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, -1, 1, 1, 1, 1, -1]), gl.STATIC_DRAW);
    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(0);
    this.ok = true;
    this.resize();
    return true;
  },
  program(vsrc, fsrc) {
    const gl = this.gl;
    const sh = (t, s) => { const x = gl.createShader(t); gl.shaderSource(x, s); gl.compileShader(x); if (!gl.getShaderParameter(x, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(x)); return x; };
    const p = gl.createProgram();
    gl.attachShader(p, sh(gl.VERTEX_SHADER, vsrc)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fsrc));
    gl.bindAttribLocation(p, 0, 'aPos'); gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {}; const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
    return { p, u };
  },
  fbo(w, h, ifmt, fmt, type) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE0);
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, ifmt, w, h, 0, fmt, type, null);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    return { tex, fb, w, h, tx: 1 / w, ty: 1 / h };
  },
  dbl(w, h, ifmt, fmt, type) {
    let a = this.fbo(w, h, ifmt, fmt, type), b = this.fbo(w, h, ifmt, fmt, type);
    return { get read() { return a; }, get write() { return b; }, swap() { const t = a; a = b; b = t; }, w, h, tx: 1 / w, ty: 1 / h };
  },
  res(r) { const gl = this.gl; const ar = gl.drawingBufferWidth / gl.drawingBufferHeight; return ar >= 1 ? [Math.round(r * ar), r] : [r, Math.round(r / ar)]; },
  resize() {
    if (!this.gl) return;
    const gl = this.gl, cv = gl.canvas;
    const dpr = Math.min(1.5, devicePixelRatio || 1);
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    const H = gl.HALF_FLOAT;
    const [sw, sh] = this.res(160), [dw, dh] = this.res(Math.min(1024, Math.round(innerHeight * dpr)));
    this.vel = this.dbl(sw, sh, gl.RG16F, gl.RG, H);
    this.dye = this.dbl(dw, dh, gl.RGBA16F, gl.RGBA, H);
    this.divg = this.fbo(sw, sh, gl.R16F, gl.RED, H);
    this.curlT = this.fbo(sw, sh, gl.R16F, gl.RED, H);
    this.pr = this.dbl(sw, sh, gl.R16F, gl.RED, H);
  },
  blit(target) {
    const gl = this.gl;
    if (target) { gl.viewport(0, 0, target.w, target.h); gl.bindFramebuffer(gl.FRAMEBUFFER, target.fb); }
    else { gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight); gl.bindFramebuffer(gl.FRAMEBUFFER, null); }
    gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
  },
  use(prog) { this.gl.useProgram(prog.p); return prog.u; },
  tex(unit, t) { const gl = this.gl; gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t.tex); return unit; },
  splat(x, y, dx, dy, color, radius = 0.0025) {
    const gl = this.gl, ar = gl.canvas.width / gl.canvas.height;
    let u = this.use(this.p.splat);
    gl.uniform1i(u.uT, this.tex(0, this.vel.read)); gl.uniform1f(u.ar, ar); gl.uniform2f(u.pt, x, y);
    gl.uniform3f(u.color, dx, dy, 0); gl.uniform1f(u.r, radius * (ar > 1 ? ar : 1)); this.blit(this.vel.write); this.vel.swap();
    gl.uniform1i(u.uT, this.tex(0, this.dye.read)); gl.uniform3f(u.color, color[0], color[1], color[2]); this.blit(this.dye.write); this.dye.swap();
  },
  step(dt, opts) {
    const gl = this.gl, v = this.vel;
    gl.disable(gl.BLEND);
    let u = this.use(this.p.curl); gl.uniform2f(u.texel, v.tx, v.ty); gl.uniform1i(u.uV, this.tex(0, v.read)); this.blit(this.curlT);
    u = this.use(this.p.vort); gl.uniform2f(u.texel, v.tx, v.ty); gl.uniform1i(u.uV, this.tex(0, v.read)); gl.uniform1i(u.uC, this.tex(1, this.curlT)); gl.uniform1f(u.curl, opts.curl); gl.uniform1f(u.dt, dt); this.blit(v.write); v.swap();
    u = this.use(this.p.div); gl.uniform2f(u.texel, v.tx, v.ty); gl.uniform1i(u.uV, this.tex(0, v.read)); this.blit(this.divg);
    u = this.use(this.p.clear); gl.uniform2f(u.texel, v.tx, v.ty); gl.uniform1i(u.uT, this.tex(0, this.pr.read)); gl.uniform1f(u.v, 0.8); this.blit(this.pr.write); this.pr.swap();
    u = this.use(this.p.press); gl.uniform2f(u.texel, v.tx, v.ty); gl.uniform1i(u.uD, this.tex(1, this.divg));
    for (let i = 0; i < 20; i++) { gl.uniform1i(u.uP, this.tex(0, this.pr.read)); this.blit(this.pr.write); this.pr.swap(); }
    u = this.use(this.p.grad); gl.uniform2f(u.texel, v.tx, v.ty); gl.uniform1i(u.uP, this.tex(0, this.pr.read)); gl.uniform1i(u.uV, this.tex(1, v.read)); this.blit(v.write); v.swap();
    u = this.use(this.p.advect); gl.uniform2f(u.texel, v.tx, v.ty); gl.uniform1i(u.uV, this.tex(0, v.read)); gl.uniform1i(u.uS, this.tex(0, v.read)); gl.uniform1f(u.dt, dt); gl.uniform1f(u.diss, opts.velDiss); this.blit(v.write); v.swap();
    u = this.use(this.p.advect); gl.uniform2f(u.texel, v.tx, v.ty); gl.uniform1i(u.uV, this.tex(0, v.read)); gl.uniform1i(u.uS, this.tex(1, this.dye.read)); gl.uniform1f(u.diss, opts.dyeDiss); this.blit(this.dye.write); this.dye.swap();
  },
  show(bg, glow) {
    const gl = this.gl;
    const u = this.use(this.p.show);
    gl.uniform2f(u.texel, this.dye.tx, this.dye.ty); gl.uniform1i(u.uS, this.tex(0, this.dye.read)); gl.uniform3f(u.bg, bg[0], bg[1], bg[2]); gl.uniform1f(u.glow, glow);
    this.blit(null);
  },
  wipe() {
    const gl = this.gl;
    for (const t of [this.vel.read, this.vel.write, this.dye.read, this.dye.write, this.pr.read, this.pr.write]) { gl.bindFramebuffer(gl.FRAMEBUFFER, t.fb); gl.viewport(0, 0, t.w, t.h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
  },
};

const PALETTES = [
  [28, 345, 290],     // ember → rose → violet
  [175, 205, 255],    // teal → sky → indigo
  [300, 330, 15],     // magenta → pink → coral
  [45, 100, 170],     // gold → lime → aqua
];

const SceneTouch = {
  t: 0, energy: 0, goal: 16, state: 'idle', pal: 0, hue: 0,
  brushes: null, ambientT: 0, doneT: 0, last: [null, null],
  enter() {
    this.t = 0; this.energy = 0; this.state = 'idle'; this.pal = 0; this.doneT = 0;
    this.brushes = [{ x: 0.35, y: 0.5, vx: 0, vy: 0 }, { x: 0.65, y: 0.5, vx: 0, vy: 0 }];
    this.last = [null, null]; this._lastPtr = null;
    this.ok = Fluid.init();
    if (this.ok) { Fluid.resize(); Fluid.wipe(); $('gl').classList.add('on'); }
    this._rs = () => { if (this.ok) Fluid.resize(); };
    addEventListener('resize', this._rs);
    this.pad = Sound.pad([110, 164.8, 220, 277.2], { gain: 0.03, cutoff: 700, type: 'triangle' });
    this.tex = Sound.noiseVoice({ type: 'bandpass', freq: 1400, q: 0.8, wet: 0.4 });
    Haptics.setLight([20, 10, 30], 3);
  },
  exit() {
    $('gl').classList.remove('on');
    removeEventListener('resize', this._rs);
    if (this.pad) this.pad.stop(2); if (this.tex) this.tex.stop(0.5);
    Haptics.clear('touch');
  },
  color(off = 0) {
    const p = PALETTES[this.pal % PALETTES.length];
    const k = (Math.sin(this.t * 0.5 + off) + 1) / 2;
    const h = k < 0.5 ? lerp(p[0], p[1], k * 2) : lerp(p[1], p[2], (k - 0.5) * 2);
    const c = hsl(h, 90, 55);
    return c;
  },
  async play() {
    this.state = 'play';
    const hintFor = () => (Input.hasTouchpad ? T('p1do_ds') : Input.source === 'gamepad' ? T('p1do_pad') : T('p1do_kb'));
    UI.hint(hintFor());
    await until(() => {
      UI.hint(hintFor());
      return this.energy >= this.goal || Game.skipReq;
    });
    UI.hint('');
    this.state = 'bloom'; this.doneT = 0;
    Sound.rise(2.2);
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * TAU;
      const c = hsl(PALETTES[i % 4][i % 3], 90, 60);
      Fluid.ok && Fluid.splat(0.5, 0.5, Math.cos(a) * 900, Math.sin(a) * 900, c.map((v) => (v / 255) * 1.4), 0.006);
    }
    Haptics.pulse(0.9, 0.9, 1.2, 'bump');
    await wait(2.4);
    this.state = 'done';
  },
  paint(i, x, y, dx, dy, mult = 1) {
    const spd = Math.hypot(dx, dy);
    if (spd < 0.0005) return;
    const c = this.color(i * 2.6 + this.t * 0.6).map((v) => (v / 255) * 0.34 * mult);
    if (this.ok) Fluid.splat(x, 1 - y, dx * 5200, -dy * 5200, c, 0.0018 + Math.min(0.004, spd * 0.03));
    if (this.state === 'play') this.energy += Math.min(spd, 0.08);
    this._spd = Math.max(this._spd || 0, spd);
    const cc = this.color(i * 2.6 + this.t * 0.6);
    Haptics.setLight(cc, 8);
  },
  burst(x, y) {
    this.pal++;
    const c = this.color().map((v) => v / 255);
    for (let k = 0; k < 6; k++) { const a = (k / 6) * TAU; if (this.ok) Fluid.splat(x, 1 - y, Math.cos(a) * 500, Math.sin(a) * 500, c.map((v) => v * 0.35), 0.003); }
    Haptics.pulse(0.7, 0.4, 0.18, 'decay');
    Sound.tone(220 * Math.pow(2, (this.pal % 5) / 5), { type: 'sine', d: 1.4, peak: 0.12, wet: 0.7 });
    Sound.noise({ d: 0.3, peak: 0.06, freq: 2500, q: 2, wet: 0.5 });

   4 · COFRE — turn the dial; every number clicks in your right hand,

const SceneSafe = {
  enter() {

    this.lamps = [0, 0, 0]; this.motes = Array.from({ length: 60 }, () => ({ x: Math.random(), y: Math.random(), s: rand(0.5, 1.6), p: rand(0, TAU) }));

    Haptics.setLight([120, 20, 20], 3);
    this.resize(View.W, View.H);
  },
  exit() { [this.room, this.hum].forEach((v) => v && v.stop(1)); },
  resize(W, H) {
    this.R = Math.min(W, H) * 0.27;

  },
  makeDoor(W, H) {

    bg.addColorStop(0, '#1e2723'); bg.addColorStop(1, '#0f1513');
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    g.strokeStyle = 'rgba(255,255,255,0.05)'; g.lineWidth = 2; g.strokeRect(m + 4, m + 4, W - m * 2 - 8, H - m * 2 - 8);

    g.fillStyle = 'rgba(220,190,130,0.55)'; g.font = '600 12px JetBrains Mono, monospace'; g.textAlign = 'center';

  },
  makeFace(R) {

    const g = c.getContext('2d'); g.scale(d, d); g.translate(S / 2, S / 2);

  async play() {

    Sound.thunk(); Haptics.pulse(1, 0.8, 0.35, 'decay');
    Haptics.setLight([255, 190, 110], 2);

  async afterPlay() { await UI.say([T('p4note'), T('p4noteText')], { hold: 6 }); },
  update(dt) {
