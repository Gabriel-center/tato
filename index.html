      g.fillText(String(this.num()).padStart(2, '0'), cx, cy + this.R * 1.32);
    }
  },
};

/* ============================================================
   5 · GIRO — tilt the real controller (accelerometer) to roll a
   marble of light through a floating maze. The board tilts with you.
   ============================================================ */
const SceneTilt = {
  enter() {
    this.t = 0; this.state = 'idle'; this.tx = 0; this.ty = 0; this.falls = 0;
    this.gen(9, 6, 11);
    this.ball = { x: 1.5, y: 1.5, vx: 0, vy: 0, r: 0.3, fall: 0, win: 0 };
    this.trail = [];
    this.cal = store('tiltcal') || null;
    this.el = document.createElement('canvas');
    this.el.style.cssText = 'position:absolute;left:50%;top:50%;z-index:1;pointer-events:none;transform-style:preserve-3d;will-change:transform;';
    $('app').insertBefore(this.el, $('grain'));
    this.bg = this.el.getContext('2d');
    this.clouds = Array.from({ length: 14 }, () => ({ x: Math.random(), y: rand(0.05, 0.95), s: rand(0.6, 1.6), v: rand(0.004, 0.012) }));
    this.roll = Sound.noiseVoice({ type: 'lowpass', freq: 300, q: 1, wet: 0.1 });
    this.pad = Sound.pad([130.8, 196, 261.6, 329.6], { gain: 0.03, cutoff: 900, type: 'triangle' });
    Haptics.setLight([255, 170, 140], 2);
    this.resize(View.W, View.H);
  },
  exit() {
    if (this.el) this.el.remove();
    [this.roll, this.pad].forEach((v) => v && v.stop(1));
    Haptics.clear('roll');
  },
  gen(cw, ch, seed) {
    const R = mulberry(seed), W = cw * 2 + 1, H = ch * 2 + 1;
    const grid = Array.from({ length: H }, () => new Array(W).fill(1));
    const seen = Array.from({ length: ch }, () => new Array(cw).fill(false));
    const stack = [[0, 0]]; seen[0][0] = true; grid[1][1] = 0;
    while (stack.length) {
      const [x, y] = stack[stack.length - 1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy, dx, dy]).filter(([a, b]) => a >= 0 && b >= 0 && a < cw && b < ch && !seen[b][a]);
      if (!nb.length) { stack.pop(); continue; }
      const [a, b, dx, dy] = nb[Math.floor(R() * nb.length)];
      seen[b][a] = true; grid[y * 2 + 1 + dy][x * 2 + 1 + dx] = 0; grid[b * 2 + 1][a * 2 + 1] = 0;
      stack.push([a, b]);
    }
    // open a few extra passages so it flows instead of trapping
    for (let i = 0; i < 6; i++) { const x = 1 + Math.floor(R() * (W - 2)), y = 1 + Math.floor(R() * (H - 2)); if ((x + y) % 2 === 1) grid[y][x] = 0; }
    this.grid = grid; this.GW = W; this.GH = H;
    this.goal = { x: W - 1.5, y: H - 1.5 };
    // holes in dead ends (not start/goal)
    this.holes = [];
    for (let y = 1; y < H - 1; y += 2) for (let x = 1; x < W - 1; x += 2) {
      const open = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => grid[y + dy][x + dx] === 0).length;
      const far = Math.hypot(x - 1, y - 1) > 3 && Math.hypot(x - (W - 2), y - (H - 2)) > 3;
      if (open === 1 && far && this.holes.length < 5 && R() < 0.6) this.holes.push({ x: x + 0.5, y: y + 0.5 });
    }
  },
  resize(W, H) {
    const maxW = W * 0.82, maxH = H * 0.72;
    this.cell = Math.floor(Math.min(maxW / this.GW, maxH / this.GH));
    const pw = this.cell * this.GW, ph = this.cell * this.GH, d = View.dpr;
    this.el.width = Math.round(pw * d); this.el.height = Math.round(ph * d);
    this.el.style.width = pw + 'px'; this.el.style.height = ph + 'px';
    this.el.style.marginLeft = -pw / 2 + 'px'; this.el.style.marginTop = -ph / 2 + 'px';
    this.pw = pw; this.ph = ph;
  },
  async calibrate() {
    if (!Input.hasMotion) return;
    const acc = () => Input.accel.slice();
    UI.hint(T('p5cal0', { b: Input.glyph('cross') }));
    await until(() => Input.pressed('cross'));
    Sound.ui();
    const a0 = acc();
    const detect = async (text, exclude) => {
      UI.hint(text);
      let res = null; const t0 = Flow.time;
      await until(() => {
        const a = acc(), d = a.map((v, i) => v - a0[i]);
        let best = -1, bv = 0;
        for (let i = 0; i < 3; i++) if (i !== exclude && Math.abs(d[i]) > bv) { bv = Math.abs(d[i]); best = i; }
        if (bv > 0.28) { res = { axis: best, sign: Math.sign(d[best]) }; return true; }
        return Flow.time - t0 > 9;
      });
      if (res) { Sound.ui(); Haptics.pulse(0.3, 0.3, 0.12); }
      await wait(0.6);
      return res;
    };
    const rx = await detect(T('p5cal1'), -1);
    const ry = await detect(T('p5cal2'), rx ? rx.axis : -1);
    this.cal = { a0, x: rx || { axis: 0, sign: -1 }, y: ry || { axis: 2, sign: 1 } };
    store('tiltcal', this.cal);
  },
  async play() {
    await this.calibrate();
    this.state = 'play';
    const hint = () => (Input.hasMotion ? T('p5do_ds') : T('p5do_pad', { ls: Input.source === 'keyboard' ? 'WASD' : (Input.padKind === 'ps' ? 'L3' : 'LS') }));
    await until(() => { UI.hint(hint()); return this.ball.win >= 1 || Game.skipReq; });
    UI.hint('');
    this.state = 'won';
    Haptics.clear('roll');
    await wait(1.5);
  },
  solid(x, y) { if (x < 0 || y < 0 || x >= this.GW || y >= this.GH) return true; return this.grid[y][x] === 1; },
  update(dt) {
    this.t += dt;
    const I = Input, B = this.ball;
    // tilt target
    let tx = 0, ty = 0;
    if (I.hasMotion && this.cal) {
      const a = I.accel, c = this.cal;
      const dX = (a[c.x.axis] - c.a0[c.x.axis]) * c.x.sign;
      const dY = (a[c.y.axis] - c.a0[c.y.axis]) * c.y.sign;
      tx = clamp(dX / 0.42, -1, 1); ty = clamp(-dY / 0.42, -1, 1);
    }
    tx += I.lx; ty += I.ly;
    if (I.pointer.down && I.source === 'keyboard') { tx += (I.pointer.x - 0.5) * 2.4; ty += (I.pointer.y - 0.5) * 2.4; }
    tx = clamp(tx, -1, 1); ty = clamp(ty, -1, 1);
    if (this.state !== 'play') { tx = 0; ty = 0; }
    this.tx = lerp(this.tx, tx, Math.min(1, dt * 10)); this.ty = lerp(this.ty, ty, Math.min(1, dt * 10));

    if (this.state === 'play' && B.fall <= 0) {
      const G = 22, steps = 5, h = dt / steps;
      let hit = 0, hitX = 0;
      for (let s = 0; s < steps; s++) {
        B.vx += this.tx * G * h; B.vy += this.ty * G * h;
        B.vx *= 1 - 0.55 * h; B.vy *= 1 - 0.55 * h;
        const sp = Math.hypot(B.vx, B.vy); if (sp > 9) { B.vx *= 9 / sp; B.vy *= 9 / sp; }
        B.x += B.vx * h; B.y += B.vy * h;
        const cx = Math.floor(B.x), cy = Math.floor(B.y);
        for (let yy = cy - 1; yy <= cy + 1; yy++) for (let xx = cx - 1; xx <= cx + 1; xx++) {
          if (!this.solid(xx, yy)) continue;
          const px = clamp(B.x, xx, xx + 1), py = clamp(B.y, yy, yy + 1);
          let nx = B.x - px, ny = B.y - py; const d = Math.hypot(nx, ny);
          if (d < B.r && d > 1e-6) {
            nx /= d; ny /= d;
            B.x += nx * (B.r - d); B.y += ny * (B.r - d);
            const vn = B.vx * nx + B.vy * ny;
            if (vn < 0) { B.vx -= (1 + 0.38) * vn * nx; B.vy -= (1 + 0.38) * vn * ny; if (-vn > hit) { hit = -vn; hitX = nx; } }
          }
        }
      }
      if (hit > 1.2) {
        const v = clamp((hit - 1.2) / 6, 0.08, 1);
        Haptics.pulse(v * (hitX > 0.3 ? 1 : 0.55), v * (hitX < -0.3 ? 1 : 0.55), 0.06 + v * 0.05, 'decay');
        Sound.bump(v, -hitX * 0.7);
      }
      const sp = Math.hypot(B.vx, B.vy);
      Haptics.set('roll', sp * 0.008, sp * 0.03);
      if (this.roll) this.roll.set(Math.min(0.12, sp * 0.015), 200 + sp * 90);
      // holes
      for (const ho of this.holes) if (Math.hypot(B.x - ho.x, B.y - ho.y) < 0.28) { B.fall = 0.001; B.hx = ho.x; B.hy = ho.y; this.falls++; Haptics.pulse(0.9, 0.9, 0.3, 'decay'); Sound.tone(300, { type: 'sine', d: 0.5, peak: 0.18, glide: 0.25, wet: 0.4 }); Haptics.lightNow([255, 40, 40]); Haptics.clear('roll'); }
      // goal
      if (Math.hypot(B.x - this.goal.x, B.y - this.goal.y) < 0.42) {
        B.win = 0.001; Sound.rise(1.4); for (let i = 0; i < 6; i++) setTimeout(() => Sound.chime(i * 2), i * 120);
        Haptics.pulse(0.6, 0.9, 1.4, 'bump'); Haptics.setLight([255, 245, 220], 3);
      }
      this.trail.push([B.x, B.y]); if (this.trail.length > 22) this.trail.shift();
    }
    if (B.fall > 0) {
      B.fall += dt; B.x = lerp(B.x, B.hx, dt * 8); B.y = lerp(B.y, B.hy, dt * 8);
      if (B.fall > 0.9) { B.fall = 0; B.x = 1.5; B.y = 1.5; B.vx = B.vy = 0; this.trail = []; Haptics.setLight([255, 170, 140], 3); Sound.tone(660, { d: 0.4, peak: 0.06 }); }
    }
    if (B.win > 0) B.win = Math.min(1, B.win + dt * 0.7);
    for (const c of this.clouds) c.x = (c.x + c.v * dt + 1.2) % 1.2;
    // lightbar breathes with speed (dawn)
    if (this.state === 'play' && B.fall <= 0 && !B.win) { const sp = Math.min(1, Math.hypot(B.vx, B.vy) / 6); Haptics.setLight([255, lerp(150, 220, sp), lerp(120, 90, sp)], 4); }
  },
  render(g, W, H) {
    // dawn sky
    const sky = g.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#20263f'); sky.addColorStop(0.45, '#7a5f86'); sky.addColorStop(0.8, '#f0a58a'); sky.addColorStop(1, '#ffd7a8');
    g.fillStyle = sky; g.fillRect(0, 0, W, H);
    const sun = g.createRadialGradient(W * 0.5, H * 1.02, 10, W * 0.5, H * 1.02, H * 0.7);
    sun.addColorStop(0, 'rgba(255,240,210,0.9)'); sun.addColorStop(0.3, 'rgba(255,200,150,0.35)'); sun.addColorStop(1, 'rgba(255,180,140,0)');
    g.fillStyle = sun; g.fillRect(0, 0, W, H);
    for (const c of this.clouds) {
      const x = (c.x - 0.1) * W, y = c.y * H, s = c.s * 90;
      g.fillStyle = `rgba(255,230,220,${0.12 + c.y * 0.12})`;
      g.beginPath(); g.ellipse(x, y, s * 1.8, s * 0.35, 0, 0, TAU); g.ellipse(x + s * 0.6, y - s * 0.15, s, s * 0.3, 0, 0, TAU); g.fill();
    }
    // shadow of the board, offset by tilt
    g.fillStyle = 'rgba(40,20,40,0.28)';
    g.beginPath(); g.ellipse(W / 2 + this.tx * 30, H / 2 + this.ph * 0.62 + this.ty * 10, this.pw * 0.5, this.ph * 0.07, 0, 0, TAU); g.fill();
    // board
    const max = 15, rx = -this.ty * max, ry = this.tx * max, lift = Math.sin(this.t * 0.9) * 6;
    this.el.style.transform = `perspective(1100px) translateY(${lift}px) rotateX(${(rx + 8).toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg)`;
    this.drawBoard();
  },
  drawBoard() {
    const g = this.bg, c = this.cell, d = View.dpr, B = this.ball;
    g.setTransform(d, 0, 0, d, 0, 0);
    g.clearRect(0, 0, this.pw, this.ph);
    // floor
    const fl = g.createLinearGradient(0, 0, this.pw, this.ph);
    fl.addColorStop(0, '#f6e7d6'); fl.addColorStop(1, '#e7cdb8');
    g.fillStyle = fl; g.fillRect(0, 0, this.pw, this.ph);
    for (let y = 0; y < this.GH; y++) for (let x = 0; x < this.GW; x++) if ((x + y) % 2 === 0 && !this.solid(x, y)) { g.fillStyle = 'rgba(160,110,90,0.05)'; g.fillRect(x * c, y * c, c, c); }
    // holes
    for (const h of this.holes) {
      const gr = g.createRadialGradient(h.x * c, h.y * c, 1, h.x * c, h.y * c, c * 0.42);
      gr.addColorStop(0, '#1d1220'); gr.addColorStop(0.75, '#3a2433'); gr.addColorStop(1, 'rgba(120,80,90,0.2)');
      g.fillStyle = gr; g.beginPath(); g.arc(h.x * c, h.y * c, c * 0.4, 0, TAU); g.fill();
    }
    // goal light
    const gp = 0.75 + Math.sin(this.t * 3) * 0.25;
    const gg = g.createRadialGradient(this.goal.x * c, this.goal.y * c, 1, this.goal.x * c, this.goal.y * c, c * 1.4);
    gg.addColorStop(0, `rgba(255,250,235,${gp})`); gg.addColorStop(0.4, `rgba(255,200,140,${0.5 * gp})`); gg.addColorStop(1, 'rgba(255,180,120,0)');
    g.fillStyle = gg; g.fillRect(this.goal.x * c - c * 1.5, this.goal.y * c - c * 1.5, c * 3, c * 3);
    // wall shadows then walls
    g.fillStyle = 'rgba(90,50,60,0.18)';
    for (let y = 0; y < this.GH; y++) for (let x = 0; x < this.GW; x++) if (this.solid(x, y)) g.fillRect(x * c + c * 0.12 - this.tx * 3, y * c + c * 0.18 - this.ty * 3, c, c);
    for (let y = 0; y < this.GH; y++) for (let x = 0; x < this.GW; x++) if (this.solid(x, y)) {
      g.fillStyle = '#5b3b57'; g.fillRect(x * c, y * c, c + 0.5, c + 0.5);
      g.fillStyle = 'rgba(255,220,200,0.18)'; g.fillRect(x * c, y * c, c + 0.5, c * 0.18);
    }
    // trail
    g.globalCompositeOperation = 'lighter';
    this.trail.forEach((p, i) => { const a = i / this.trail.length; g.fillStyle = `rgba(255,200,140,${a * 0.25})`; g.beginPath(); g.arc(p[0] * c, p[1] * c, B.r * c * a, 0, TAU); g.fill(); });
    g.globalCompositeOperation = 'source-over';
    // ball
    const s = B.fall > 0 ? Math.max(0, 1 - B.fall / 0.6) : B.win > 0 ? 1 + B.win * 2 : 1;
    const bx = B.x * c, by = B.y * c, br = B.r * c * s;
    if (br > 0.5) {
      g.fillStyle = 'rgba(90,40,50,0.25)'; g.beginPath(); g.arc(bx + 3 - this.tx * 2, by + 4 - this.ty * 2, br, 0, TAU); g.fill();
      const bg = g.createRadialGradient(bx - br * 0.35, by - br * 0.4, br * 0.1, bx, by, br * 1.6);
      bg.addColorStop(0, '#fffaf0'); bg.addColorStop(0.4, '#ffd59a'); bg.addColorStop(1, 'rgba(255,150,90,0)');
      g.fillStyle = bg; g.beginPath(); g.arc(bx, by, br * 1.6, 0, TAU); g.fill();
      g.fillStyle = '#fff8ea'; g.beginPath(); g.arc(bx, by, br * 0.78, 0, TAU); g.fill();
    }
    if (B.win > 0) { g.fillStyle = `rgba(255,250,235,${B.win * 0.85})`; g.fillRect(0, 0, this.pw, this.ph); }
  },
};

/* ============================================================
   FINALE — hold both triggers: the controller beats like a heart.
   The sixth braille dot fills. ⠿ = "é" (pt) / "for" (en).
   ============================================================ */
const SceneFinale = {
  enter() {
    this.t = 0; this.beats = 0; this.need = 8; this.dot6 = 0; this.state = 'idle'; this.nextBeat = 0;
    this.hr = 1.0; this.beatAmp = 1; this.pulseV = 0; this.word = 0; this.credits = 0; this.holding = false;
    $('app').classList.add('light');
    Haptics.setLight([255, 240, 225], 2);
    this.pad = Sound.pad([87.3, 130.8, 174.6, 220], { gain: 0.025, cutoff: 600, type: 'sine' });
  },
  exit() { $('app').classList.remove('light'); if (this.pad) this.pad.stop(2); Haptics.micLed = 0; },
  beat(intensity) {
    // lub
    Sound.heart(true);
    Haptics.pulse(0.85 * intensity, 0.25 * intensity, 0.13, 'decay');
    Haptics.setTrigger('L', { type: 'vibration', pos: 0, amp: Math.max(1, Math.round(7 * intensity)), freq: 22 });
    Haptics.setTrigger('R', { type: 'vibration', pos: 0, amp: Math.max(1, Math.round(7 * intensity)), freq: 22 });
    this.pulseV = 1;
    Haptics.lightNow([255, lerp(200, 40, intensity), lerp(200, 50, intensity)]);
    Haptics.setLight([255, 236, 225], 3);
    // dub
    setTimeout(() => {
      if (Game.scene !== this || Game.paused) return;
      Sound.heart(false);
      Haptics.pulse(0.3 * intensity, 0.7 * intensity, 0.1, 'decay');
      this.pulseV = Math.max(this.pulseV, 0.6);
    }, 260);
    setTimeout(() => {
      if (Game.scene !== this) return;
      Haptics.setTrigger('L', { type: 'feedback', pos: 0, str: 1 }); Haptics.setTrigger('R', { type: 'feedback', pos: 0, str: 1 });
    }, 150);
  },
  async play() {
    await UI.say(T('f1'));
    this.state = 'hold';
    Haptics.micLed = 2;
    UI.hint(T('fhold', { l2: Input.glyph('l2'), r2: Input.glyph('r2') }));
    await until(() => this.beats >= this.need || Game.skipReq);
    UI.hint('');
    this.state = 'full';
    Sound.dot(5);
    UI.setDots(6, 5);
    Haptics.pulse(0.6, 0.6, 0.5, 'bump');
    await wait(1.5);
    this.state = 'after';
    await UI.say(T('f2'), { slow: true });
    this.state = 'fading';
    await wait(2.5);
    Haptics.allOff(); Haptics.micLed = 0;
    this.state = 'cell';
    await wait(1.2);
    await UI.say(T('fcell1'));
    this.state = 'word';
    Sound.tone(523.25, { type: 'sine', d: 3, peak: 0.12, wet: 0.9 });
    Sound.tone(784, { type: 'sine', d: 3, peak: 0.07, wet: 0.9, at: 0.1 });
    Haptics.pulse(0.3, 0.5, 0.6, 'bump');
    await wait(2.6);
    await UI.say([T('fcell2')], { hold: 4, slow: true });
    this.state = 'credits';
    await wait(0.8);
    await until(() => Input.pressed('cross') || Input.pressed('options'));
  },
  update(dt) {
    this.t += dt;
    this.pulseV = Math.max(0, this.pulseV - dt * 2.4);
    if (this.state === 'hold') {
      this.holding = Input.l2 > 0.45 && Input.r2 > 0.45;
      this.nextBeat -= dt;
      if (this.nextBeat <= 0) {
        if (this.holding) { this.beat(1); this.beats++; this.nextBeat = 0.95; }
        else { this.beat(0.18); this.nextBeat = 1.25; }
      }
      this.dot6 = lerp(this.dot6, this.beats / this.need, Math.min(1, dt * 4));
    } else if (this.state === 'full' || this.state === 'after' || this.state === 'fading') {
      this.dot6 = lerp(this.dot6, 1, Math.min(1, dt * 4));
      this.nextBeat -= dt;
      const k = this.state === 'fading' ? 0.12 : this.state === 'after' ? 0.35 : 0.8;
      if (this.nextBeat <= 0) { this.beat(k); this.nextBeat = this.state === 'after' ? 1.15 : 1.4; }
    } else if (this.state === 'word' || this.state === 'cell') {
      this.word = Math.min(1, this.word + dt * (this.state === 'word' ? 0.6 : 0));
    } else if (this.state === 'credits') {
      this.word = 1;
      this.credits = Math.min(1, this.credits + dt * 0.5);
      UI.hint(T('next', { b: Input.glyph('cross') }));
    }
  },
  render(g, W, H) {
    g.fillStyle = '#f7f0e5'; g.fillRect(0, 0, W, H);
    const warm = g.createRadialGradient(W / 2, H * 0.45, 10, W / 2, H * 0.45, Math.max(W, H) * 0.7);
    warm.addColorStop(0, `rgba(255,${200 - this.pulseV * 60},${170 - this.pulseV * 80},${0.25 + this.pulseV * 0.25})`); warm.addColorStop(1, 'rgba(247,240,229,0)');
    g.fillStyle = warm; g.fillRect(0, 0, W, H);
    // the cell
    const credits = this.credits;
    const s = Math.min(W, H) / 900 * (1 - credits * 0.3) * (W < 600 ? 0.8 : 1);
    const sp = 95 * s, r = 30 * s;
    g.font = `400 ${Math.round(170 * s)}px Gloock, serif`;
    const wordTxt = '= ' + T('fword'), wordW = g.measureText(wordTxt).width, gap = 46 * s;
    const groupW = sp + 2 * r + gap + wordW;
    const ws = smooth(this.word);
    const cx = W / 2 - ws * (groupW / 2 - (sp / 2 + r));
    const cy = H * lerp(0.45, 0.28, ws);
    const pos = [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]];
    const narrBusy = UI.narrating && this.state !== 'word' && this.state !== 'credits';
    const alpha = 1;
    pos.forEach(([px, py], i) => {
      const x = cx + (px - 0.5) * sp, y = cy + (py - 1) * sp;
      let k = i < 5 ? 1 : this.dot6;
      const beat = this.pulseV * (i === 5 ? 0.25 : 0.08);
      g.fillStyle = `rgba(40,30,30,${0.07 * alpha})`; g.beginPath(); g.arc(x, y, r * 0.55, 0, TAU); g.fill();
      if (k > 0.01) {
        const rr = r * (0.55 + 0.45 * k) * (1 + beat);
        g.fillStyle = `rgba(80,40,30,${0.18 * alpha})`; g.beginPath(); g.arc(x + 4 * s, y + 7 * s, rr * 1.1, 0, TAU); g.fill();
        const gr = g.createRadialGradient(x - rr * 0.35, y - rr * 0.4, rr * 0.1, x, y, rr);
        const hot = i === 5 ? this.pulseV : 0;
        gr.addColorStop(0, `rgba(255,252,246,${alpha})`); gr.addColorStop(0.6, `rgba(${235 + hot * 20},${200 - hot * 80},${170 - hot * 90},${alpha})`); gr.addColorStop(1, `rgba(${170 + hot * 60},${120 - hot * 50},${100 - hot * 40},${alpha})`);
        g.fillStyle = gr; g.beginPath(); g.arc(x, y, rr, 0, TAU); g.fill();
      }
    });
    // the word
    if (this.word > 0) {
      g.globalAlpha = smooth(this.word);
      g.fillStyle = '#2a1f22'; g.textAlign = 'left'; g.textBaseline = 'middle';
      g.font = `400 ${Math.round(170 * s)}px Gloock, serif`;
      g.fillText(wordTxt, cx + sp / 2 + r + gap, cy + 10 * s);
      g.font = `400 ${Math.round(Math.max(12, 17 * s))}px JetBrains Mono, monospace`; g.fillStyle = 'rgba(42,31,34,0.55)';
      g.textAlign = 'center'; g.fillText(T('fcellGloss'), W / 2, cy + sp * 1.6 + r);
      g.globalAlpha = 1; g.textBaseline = 'alphabetic';
    }
    if (credits > 0) {
      g.globalAlpha = credits; g.textAlign = 'center'; g.fillStyle = '#2a1f22';
      const y0 = H * 0.68;
      g.font = `400 ${Math.round(clamp(W * 0.05, 34, 60))}px Gloock, serif`;
      g.fillText('TATO', W / 2, y0);
      g.font = `italic 300 ${Math.round(clamp(W * 0.02, 17, 24))}px Newsreader, Georgia, serif`;
      g.fillText(T('credits1'), W / 2, y0 + 40);
      g.font = '400 13px JetBrains Mono, monospace'; g.fillStyle = 'rgba(42,31,34,0.6)';
      g.fillText(T('credits2'), W / 2, y0 + 70);
      const st = Game.stats, sec = Math.round(Flow.time - st.start);
      g.fillText(T('stats', { time: Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'), shots: st.shots, top: st.top, ticks: st.ticks }), W / 2, y0 + 96);
      g.globalAlpha = 1;
    }
  },
};

async function runFinale() {
  Game.playIdx = 5;
  await Game.transition(SceneFinale, true);
  Game.inPlay = true; Game.skipReq = false;
  await SceneFinale.play();
  Game.inPlay = false;
  UI.hint('');
  toTitle();
}

boot();
</script>
